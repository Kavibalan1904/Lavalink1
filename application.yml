server:
  address: 0.0.0.0
  port: ${PORT:2333}

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    trackStuckThresholdMs: 15000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Try multiple YouTube client types, but clients alone cannot resolve
    # videos that require an authenticated YouTube session.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEBEMBEDDED

    # Enable the supported YouTube OAuth flow for datacenter-IP challenges.
    # Use a burner/secondary Google account, not your primary account.
    # On first boot, leave YOUTUBE_OAUTH_REFRESH_TOKEN unset and follow the
    # device-login instructions in the Render logs.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INIT:false}

    # Optional PO token settings. OAuth does not require a PO token.
    pot:
      token: "${YOUTUBE_PO_TOKEN}"
      visitorData: "${YOUTUBE_VISITOR_DATA}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: false
