
server:
  address: 0.0.0.0
  port: ${PORT:2333}

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    trackStuckThresholdMs: 15000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - MUSIC
      - WEB
      - WEBEMBEDDED

    pot:
      token: "${YOUTUBE_PO_TOKEN}"
      visitorData: "${YOUTUBE_VISITOR_DATA}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: false
