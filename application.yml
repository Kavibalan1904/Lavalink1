
server:
  address: 0.0.0.0
  port: ${PORT:10000}

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

  server:
    password: ${LAVALINK_SERVER_PASSWORD}

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - ANDROID_VR
      - WEB
      - MWEB
      - WEBEMBEDDED
      - ANDROID_MUSIC
      - IOS

logging:
  level:
    root: INFO
    lavalink: INFO

  request:
    enabled: true
    includeClientInfo: false
    includeHeaders: false
    includeQueryString: false
    includePayload: false
