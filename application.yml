server:
  address: 0.0.0.0
  port: ${PORT:2333}

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    trackStuckThresholdMs: 15000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Client fallback helps with some playback cases, but cannot resolve
    # videos that require an authenticated YouTube session by itself.
    clients:
      - MUSIC
      - ANDROID_VR
      - WEBEMBEDDED

    # OAuth can help when YouTube challenges the Render/datacenter IP.
    # Use a burner/secondary Google account, not your primary account.
    # On first boot, leave YOUTUBE_OAUTH_REFRESH_TOKEN unset so the plugin
    # can print its device-login instructions in the Render logs.
    # After completing login, set the refresh token in Render environment.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INIT:false}

    # Optional PO token configuration. OAuth and PO tokens are alternatives;
    # if using OAuth, a PO token is not required.
    pot:
      token: "${YOUTUBE_PO_TOKEN}"
      visitorData: "${YOUTUBE_VISITOR_DATA}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: false
