server:
  address: 0.0.0.0
  port: ${PORT:2333}

lavalink:
  server:
    password: "${LAVALINK_PASSWORD}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    trackStuckThresholdMs: 15000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # TV is the YouTube client that supports OAuth. Keep it first so
    # authenticated playback is attempted before unauthenticated fallbacks.
    clients:
      - TV
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
      - MUSIC

    # Use a burner/secondary Google account, not your primary account.
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN:}"
      skipInitialization: ${YOUTUBE_OAUTH_SKIP_INIT:false}

    # OAuth does not require a PO token. These optional values are retained
    # for setups that intentionally use PO tokens with compatible clients.
    pot:
      token: "${YOUTUBE_PO_TOKEN}"
      visitorData: "${YOUTUBE_VISITOR_DATA}"

logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: false
