server:
  address: 0.0.0.0
  port: ${SERVER_PORT:${PORT:2333}}

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:b33460b38ad13b5cd07da75e46444397cf0ea2df"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"

  server:
    password: "${LAVALINK_PASSWORD:d4e25d63@Reso}"

    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      nico: true
      http: true
      local: false

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    trackStuckThresholdMs: 60000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Follow the upstream recommended client order. TV is last because TVHTML5
    # streams have shown stalled playback on some cloud-hosted OAuth sessions.
    # Prioritize TV client for OAuth playback, then MUSIC and WEB fallbacks
    clients:
      - TV
      - MUSIC
      - WEB

    remoteCipher:
      url: "${YOUTUBE_REMOTE_CIPHER_URL:https://cipher.kikkia.dev/}"
      userAgent: "Reso Discord music bot"

    # YouTube OAuth2 Authentication to bypass datacenter IP login requirements
    oauth:
      enabled: true
      skipInitialization: false

    pot:
      token: "${YOUTUBE_PO_TOKEN:MlVFZRCWPwJhCkVb2kNcEFO5m8QSC5hbSRi0MK5QyJvpMLjKA_98bpXDljbemuyQZarOQmnBPYN8drGXG7ryQ0Dfgmv57yTROtMc8bvP8aoQdlFiUzOM}"
      visitorData: "${YOUTUBE_VISITOR_DATA:%3D%3D}"

  lavasrc:
    # Spotify provides metadata; these providers locate a playable audio mirror.
    # Prefer exact ISRC matching first, then broader searches as fallbacks.
    providers:
      - "ytmsearch:\"%ISRC%\""
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
      vkmusic: false
      tidal: false
      qobuz: false
      ytdlp: false
      jiosaavn: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:7452cb4590f647a2b5dbb0baebe946b5}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:1432609f561d4e14acad012c3b22d9e2}"
      countryCode: "${SPOTIFY_COUNTRY_CODE:IN}"
      playlistLoadLimit: 200
      albumLoadLimit: 100
      # Use the configured Spotify application credentials instead of anonymous tokens.
      preferAnonymousToken: false
      # Avoid the artist-details endpoint, which currently returns HTTP 403 in Render logs.
      resolveArtistsInSearch: false
      preferPartnerApi: false

logging:
  level:
    dev.lavalink.youtube.plugin.YoutubePluginLoader: INFO
    dev.lavalink.youtube.YoutubeSource: INFO
    dev.lavalink.youtube.clients.skeleton.NonMusicClient: INFO
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  request:
    enabled: false
